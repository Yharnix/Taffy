---
on:
  - push
permissions:
  id-token: write
jobs:
  auth-and-run:
    uses: Yharnix/ci/.github/workflows/issue_ecr_creds.yml@master
    with:
      workflow_ref: $GITHUB_WORFLOW
  test_creds:
    needs: auth-and-run
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ needs.auth-and-run.outputs.access_key }}
      AWS_SECRET_ACCESS_KEY: ${{ needs.auth-and-run.outputs.secret_access }}
      AWS_SESSION_TOKEN: ${{ needs.auth-and-run.outputs.session_token }}
    steps:
      - name: Run AWS CLI commands
        run: |
          echo "oh yeah ${{needs.auth-and-run.outputs}}"
          aws sts get-caller-identity
          aws s3 ls
  build-image:
    uses: Yharnix/ci/.github/workflows/docker_build.yml@master 


  push-image:
    needs: [auth-and-run, build-image]
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ needs.auth-and-run.outputs.access_key }}
      AWS_SECRET_ACCESS_KEY: ${{ needs.auth-and-run.outputs.secret_access }}
      AWS_SESSION_TOKEN: ${{ needs.auth-and-run.outputs.session_token }}
      AWS_REGION: us-east-1
      ACCOUNT_ID: 037444031381
      REPO: taffy-images
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Login to ECR
        run: |
          aws ecr get-login-password --region "$AWS_REGION" \
          | docker login --username AWS --password-stdin "$ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com"

      # If docker_build.yml built "my-app:$IMAGE_TAG" locally, tag + push it:
      # - name: Tag & push image
      #   run: |
      #     ECR_URI="$ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$REPO"
      #     docker tag my-app:"$IMAGE_TAG" "$ECR_URI:$IMAGE_TAG"
      #     docker push "$ECR_URI:$IMAGE_TAG"
          


      # - name: "upload to ecr repo"
      #   run: aws ecr get-login-password --region us-east-1 \
      #     | docker login --username AWS --password-stdin 037444031381.dkr.ecr.us-east-1.amazonaws.com